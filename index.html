  let timeInSeconds = 40 * 60; // 40 minutes
  let timerInterval;

  function renderQuestions() {
    const container = document.getElementById('questions-container');
    container.innerHTML = '';

    questions.forEach((item) => {
      const card = document.createElement('div');
      card.className = 'question-card';
      card.id = `q-card-${item.id}`;

      let optionsHtml = '';
      for (const [key, val] of Object.entries(item.options)) {
        optionsHtml += `
          <li>
            <label id="lbl-${item.id}-${key}">
              <input type="radio" name="q${item.id}" value="${key}">
              ${key}. ${val}
            </label>
          </li>
        `;
      }

      card.innerHTML = `
        <div class="question-title">${item.q}</div>
        <ul class="options-list">${optionsHtml}</ul>
      `;
      container.appendChild(card);
    });
  }

  function startTest() {
    const name = document.getElementById('student-name').value.trim();
    const email = document.getElementById('student-email').value.trim();

    if (!name || !email) {
      alert("Please fill in both Name and Email to start the test.");
      return;
    }

    document.getElementById('registration-section').style.display = 'none';
    document.getElementById('test-section').style.display = 'block';

    renderQuestions();
    startTimer();
  }

  function startTimer() {
    timerInterval = setInterval(() => {
      timeInSeconds--;
      let minutes = Math.floor(timeInSeconds / 60);
      let seconds = timeInSeconds % 60;

      document.getElementById('time-display').innerText = 
        `${minutes < 10 ? '0' : ''}${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;

      if (timeInSeconds <= 0) {
        clearInterval(timerInterval);
        alert("Time is up! Your test will be submitted automatically.");
        submitTest();
      }
    }, 1000);
  }

  function submitTest() {
    clearInterval(timerInterval);

    let score = 0;
    const form = document.getElementById('quiz-form');
    const formData = new FormData(form);

    questions.forEach(item => {
      const userAns = formData.get(`q${item.id}`);
      const correctAns = item.ans;

      // Disable inputs after submission
      const radios = document.getElementsByName(`q${item.id}`);
      radios.forEach(r => r.disabled = true);

      // $+1$ for correct answer, no negative marking[cite: 1]
      if (userAns === correctAns) {
        score++;
      }

      // Preview coloring: Correct = Green, Wrong attempt = Red[cite: 1]
      if (userAns) {
        if (userAns === correctAns) {
          document.getElementById(`lbl-${item.id}-${userAns}`).classList.add('opt-correct');
        } else {
          document.getElementById(`lbl-${item.id}-${userAns}`).classList.add('opt-wrong');
          document.getElementById(`lbl-${item.id}-${correctAns}`).classList.add('opt-correct');
        }
      } else {
        // If question was skipped, show the correct answer in green
        document.getElementById(`lbl-${item.id}-${correctAns}`).classList.add('opt-correct');
      }
    });

    // Display total result score
    document.getElementById('result-box').style.display = 'block';
    document.getElementById('score-text').innerHTML = `Your Score: <strong>${score} / ${questions.length}</strong>`;
    
    // Hide top timer and submit button
    document.getElementById('timer-sticky').style.display = 'none';
    form.querySelector('button[type="button"]').style.display = 'none';

    // Send result to Google Sheet[cite: 1]
    sendToGoogleSheet(score);
  }

  function sendToGoogleSheet(score) {
    if (GOOGLE_SCRIPT_URL === "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL" || !GOOGLE_SCRIPT_URL) {
      console.warn("Google Apps Script URL is not set. Submissions will not sync to Google Sheets.");
      return;
    }

    const name = document.getElementById('student-name').value;
    const email = document.getElementById('student-email').value;

    const payload = {
      name: name,
      email: email,
      score: score,
      total: questions.length,
      timestamp: new Date().toLocaleString()
    };

    fetch(GOOGLE_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(payload)
    })
    .then(() => console.log("Data successfully posted to Google Apps Script."))
    .catch(err => console.error("Error connecting to Google Apps Script:", err));
  }
</script>
